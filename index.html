<style>
:root{color-scheme:dark;--g:#0a6b2c;--lime:#9dff3a;--gold:#ffd23f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:#04140a;color:#eafff0;font-family:"Trebuchet MS",system-ui,sans-serif;display:flex;justify-content:center;overflow-x:hidden;position:relative}
body::before,body::after{content:"";position:fixed;width:70vmax;height:70vmax;border-radius:50%;filter:blur(80px);opacity:.45;z-index:-1;animation:drift 12s ease-in-out infinite alternate}
body::before{background:#12c24d;top:-30vmax;left:-20vmax}
body::after{background:#ffd23f55;bottom:-35vmax;right:-25vmax;animation-delay:-6s}
@keyframes drift{to{transform:translate(8vmax,6vmax)}}
main{width:100%;max-width:520px;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.hero{position:relative;width:100%}
.hero img{display:block;width:min(100vw,68svh);max-width:100%;aspect-ratio:1;object-fit:cover;margin:auto;border-radius:0 0 36px 36px;border-bottom:4px solid var(--gold);box-shadow:0 20px 60px #000b,0 10px 70px #1fe05c55}
.btn{position:relative;z-index:2;overflow:hidden;display:flex;align-items:center;gap:14px;margin-top:-30px;padding:10px 12px 10px 28px;border-radius:99px;background:linear-gradient(180deg,#32e06a,#0a8f35);color:#fff;font:900 22px Impact,"Arial Black",sans-serif;letter-spacing:1px;text-transform:uppercase;text-decoration:none;border:3px solid var(--gold);box-shadow:0 8px 0 #06501e,0 0 40px #28e060aa;animation:beat 1.8s infinite}
.btn b{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:var(--gold);color:#064d1c;font-size:24px;animation:nudge 1.2s infinite}
.btn::after{content:"";position:absolute;top:0;left:-60%;width:35%;height:100%;background:linear-gradient(100deg,transparent,#fff8,transparent);transform:skewX(-20deg);animation:shine 3s infinite}
.btn:active{transform:translateY(5px);box-shadow:0 3px 0 #06501e}
@keyframes beat{50%{transform:scale(1.05)}}
@keyframes nudge{50%{transform:translateX(5px)}}
@keyframes shine{to{left:130%}}
small{margin-top:18px;font-size:11px;color:#9fd6b0;text-align:center}
small b{color:var(--gold)}
.oc{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:9;background:#fff;color:#111;text-align:center;padding:12px;font:700 14px system-ui,sans-serif;text-decoration:none;box-shadow:0 4px 16px #0008}.oc[hidden]{display:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
